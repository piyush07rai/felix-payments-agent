services:
  decline-analyst:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payments-decline-analyst
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - APP_ENV=${APP_ENV:-production}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_PATH=${DATABASE_PATH:-data/declines.db}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
